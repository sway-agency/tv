name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norminette:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/norminette.py

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|style|test|build|ci|chore)(\([a-z0-9-]+\))?!?: [^ ].{0,118}[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must follow Conventional Commits on one line, e.g. 'feat(dock): add sleep timer'"
            exit 1
          fi

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" >/dev/null
      - name: Compile with every warning as an error
        run: |
          mkdir -p build/lint
          javac --release 8 -Xlint:all -Xlint:-options -Werror \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d build/lint $(find src -name '*.java')
      - name: Build the APK
        run: ANDROID_SDK="$ANDROID_HOME" ACCUEIL_JDK="$JAVA_HOME" ./build.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: bridge
        run: echo "present=$(test -f bridge/go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.bridge.outputs.present == 'true'
        with:
          go-version-file: bridge/go.mod
          cache: false
      - name: Vet, test, build and scan the bridge
        if: steps.bridge.outputs.present == 'true'
        working-directory: bridge
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -o /dev/null ./cmd/accueil-bridge
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
