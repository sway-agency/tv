table inet accueil_bridge {
    set trusted {
        type ipv4_addr
        flags interval
        elements = { 192.168.1.0/24, 10.8.0.0/24 }
    }

    chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 8443 ip saddr @trusted accept
        tcp dport 8443 drop
    }
}
